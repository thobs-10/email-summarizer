[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[project]
name = "email-summarizer"
version = "0.1.0"
description = "Local-first Gmail newsletter summarizer agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
	"google-auth>=2.58.0",
	"google-auth-oauthlib>=1.4.1",
	"langchain>=1.4.2",
	"loguru>=0.7.3",
	"pydantic>=2.8.0",
	"pydantic-settings>=2.4.0",
	"python-dotenv>=1.0.1",
	"requests>=2.34.2",
]

[project.scripts]
single-agent = "main:main"

[tool.uv.build-backend]
module-name = "email_summarizer"

[tool.setuptools_scm]
write_to = "_version.py"
version_scheme = "release-branch-semver"

[dependency-groups]
dev = [
	"bandit>=1.8.0",
	"pre-commit>=4.6.1",
	"pytest-cov>=7.1.0",
	"pytest-instafail>=0.5.0",
	"pytest-mock>=3.15.1",
	"pytest-randomly>=4.1.0",
	"pytest-xdist>=3.8.0",
	"ruff>=0.14.0",
]

# ---------------------------------------------------
# Ruff (linting + formatting)
# ---------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "C90", "I"] # I = isort import sorting
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # example: allow asserts in tests

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------
# pytest
# ---------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q --cov=src --cov-report=term-missing"
markers = ["slow: marks tests as slow", "integration: marks integration tests"]

# ---------------------------------------------------
# coverage.py (used by pytest-cov)
# ---------------------------------------------------
[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
