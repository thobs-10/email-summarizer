name: CI Pipeline

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master
            - dev
    workflow_call:

# Cancel superseded runs on the same branch/PR to avoid wasting CI minutes.
concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    UV_VERSION: "0.9"
    PYTHON_VERSION: "3.12"

jobs:
    lint-test-security:
        name: Lint, test, and scan
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  # gitleaks needs full history to diff base..head commits.
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v4
              with:
                  version: ${{ env.UV_VERSION }}
                  python-version: ${{ env.PYTHON_VERSION }}
                  enable-cache: true

            - name: Install dependencies
              run: uv sync --group dev

            - name: Ruff lint
              run: uv run ruff check src tests

            - name: Ruff format check
              run: uv run ruff format --check src tests

            - name: Bandit security scan
              run: uv run bandit -r src -ll

            - name: Scan for committed secrets
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Run tests
              run: uv run pytest -q

    docker-build:
        name: Build container image
        runs-on: ubuntu-latest
        needs: lint-test-security
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Skip the image build until Phase 13 adds a real Dockerfile; it switches on by itself.
            - name: Check for Dockerfile
              id: dockerfile
              run: |
                  if [ -s Dockerfile ]; then
                      echo "present=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "present=false" >> "$GITHUB_OUTPUT"
                      echo "::notice::No Dockerfile yet (Phase 13); skipping the image build."
                  fi

            - name: Set up Docker Buildx
              if: steps.dockerfile.outputs.present == 'true'
              uses: docker/setup-buildx-action@v3

            - name: Build image (no push)
              if: steps.dockerfile.outputs.present == 'true'
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: false
                  cache-from: type=gha,scope=app
                  cache-to: type=gha,mode=max,scope=app
