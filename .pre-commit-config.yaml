repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.11.31
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # - repo: https://github.com/ReubenJ/pre-commit-pyright
  #   rev: 1.1.322
  #   hooks:
  #     - id: pyright
  # adding bandit fixes security issues in code
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.4
    hooks:
      - id: bandit
        additional_dependencies: ["pbr"]
        args: ["-r", "src/", "-x", "src/single_agent/tests"]
        pass_filenames: false
  # complexity checks via flake8's C901 (mccabe)
  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-complexity=10", "--select=C901"]

    # ---- Custom: ensure tests accompany source changes ----
  - repo: local
    hooks:
      - id: check-tests
        name: Check unit tests for changed code
        entry: python scripts/check_tests.py
        language: python
        pass_filenames: false
        files: '^(src|api|pipeline|utils)/.*\\.py$|^application\\.py$'
        stages: [pre-commit]
